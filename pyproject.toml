[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-review-classifier"
version = "0.1.0"
description = "Reproducible experiments for review sentiment classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
